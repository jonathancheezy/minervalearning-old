name: Push to Cloudflare Repo

on:
  push:
    branches:
      - main

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Push to minervalearning-admin
        run: |
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/jonathancheezy/minervalearning-admin.git main:master
